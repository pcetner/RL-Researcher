# Lint, type-check and test on the two Python versions the consumers run.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check rl_researcher tests
      - name: Type-check
        run: mypy rl_researcher
      - name: Tests (includes the toy kind end to end)
        run: pytest -q

  workflows:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Workflow persistence and OS locking
        run: pytest tests/test_workflows.py -q
      - name: Real HTTP browser workflows
        env:
          RL_BROWSER_TESTS: "1"
        run: pytest tests/test_browser_workflows.py -q
