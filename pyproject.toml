[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "rl-researcher"
version = "0.3.0"
description = "A local webpage, sequential experiment execution, and per-execution evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Peter Cetner"}]
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "playwright>=1.40"]
haws = ["haws-core>=0.1.0"]
[tool.setuptools.packages.find]
where = ["."]
include = ["rl_researcher*"]
[tool.setuptools.package-data]
rl_researcher = ["py.typed", "ui/*.html", "ui/*.js", "ui/*.css", "ui/fonts/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
