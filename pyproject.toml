[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-researcher"
version = "0.1.0"
description = "Tooling for LLM-run, human-gated research: pre-registered runs, generated artefacts, a findings ledger, a cost gate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Peter Cetner" }]

# The framework never imports torch: training lives in the consuming project's adapters.
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.8",
    "markdown-it-py>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_researcher*"]

[tool.setuptools.package-data]
rl_researcher = ["py.typed", "*.ps1", "examples/toy/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
timeout = 120
markers = [
    "tier1: fast, no GPU and no project data - the default gate",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
